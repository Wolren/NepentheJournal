kotlin.code.style=official
android.useAndroidX=true
# On GTX 650 machines: export JDK_JAVA_OPTIONS="-Dskiko.renderApi=SOFTWARE" before ./gradlew desktopTest
org.gradle.jvmargs=-Xmx2048M -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.native.ignoreDisabledTargets=true
android.disableAarMetadataCheck=true
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
