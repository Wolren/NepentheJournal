name: google-play

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: true

# NOTE: pins Java 17 for the Android toolchain; CI/CodeQL use Java 21.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Build AAB and publish to internal track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # android-actions/setup-android@v3 deliberately absent GitHub Ubuntu image already ships a licensed Android SDK.
      # GitHub Ubuntu image already ships a licensed Android SDK.
      - name: Restore signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > nepenthe-upload.keystore
          cat > keystore.properties <<EOF
          storeFile=nepenthe-upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > play-service-account.json

      - name: Build signed AAB
        run: |
          ./gradlew :composeApp:bundleRelease --no-daemon --stacktrace

      - name: Upload to Google Play (internal track)
        run: |
          ./gradlew :composeApp:publishBundle --no-daemon --stacktrace
