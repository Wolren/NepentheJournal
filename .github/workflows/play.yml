name: google-play

# Builds the signed release AAB and uploads it (plus fastlane metadata) to
# Google Play's internal testing track via Gradle Play Publisher.
#
# Prerequisites (one-time, see docs/GOOGLE-PLAY.md):
#   - Play Console app created (app.journal.nepenthe)
#   - Service account with "Release to production/testing" permission
#   - Upload keystore generated
#   - GitHub secrets configured:
#       PLAY_SERVICE_ACCOUNT_JSON  (base64 of the service account JSON)
#       KEYSTORE_BASE64            (base64 of the upload keystore)
#       KEYSTORE_PASSWORD
#       KEY_ALIAS
#       KEY_PASSWORD
#
# Trigger: manually (workflow_dispatch) or on every v* tag.
# Uploads go to the INTERNAL TESTING track; promote to production manually
# in Play Console after review.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Build AAB and publish to internal track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      - name: Restore signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > nepenthe-upload.keystore
          cat > keystore.properties <<EOF
          storeFile=nepenthe-upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > play-service-account.json

      - name: Build signed AAB
        run: |
          ./gradlew :composeApp:bundleRelease --no-daemon --stacktrace

      - name: Upload to Google Play (internal track)
        run: |
          ./gradlew :composeApp:publishBundle --no-daemon --stacktrace
