name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx2g
  GRADLE_CACHE_KEY: kotlin-2.4-gradle-9.6

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref_name != 'master' }}

      - name: Verify bundled seed copies are identical
        run: |
          sha256sum scripts/seed.json \
            composeApp/src/desktopMain/resources/psychonautwiki_seed.json \
            composeApp/src/jvmMain/resources/psychonautwiki_seed.json \
            composeApp/src/iosMain/resources/psychonautwiki_seed.json \
            composeApp/src/androidMain/assets/psychonautwiki_seed.json
          test "$(sha256sum < scripts/seed.json)" = "$(sha256sum < composeApp/src/desktopMain/resources/psychonautwiki_seed.json)"
          test "$(sha256sum < scripts/seed.json)" = "$(sha256sum < composeApp/src/jvmMain/resources/psychonautwiki_seed.json)"
          test "$(sha256sum < scripts/seed.json)" = "$(sha256sum < composeApp/src/iosMain/resources/psychonautwiki_seed.json)"
          test "$(sha256sum < scripts/seed.json)" = "$(sha256sum < composeApp/src/androidMain/assets/psychonautwiki_seed.json)"
          echo "SEEDS IDENTICAL: scripts/seed.json matches all four bundled copies."
          sha256sum composeApp/src/desktopMain/resources/dosewiki_slim.json \
            composeApp/src/jvmMain/resources/dosewiki_slim.json \
            composeApp/src/iosMain/resources/dosewiki_slim.json \
            composeApp/src/androidMain/assets/dosewiki_slim.json
          test "$(sha256sum < composeApp/src/desktopMain/resources/dosewiki_slim.json)" = "$(sha256sum < composeApp/src/jvmMain/resources/dosewiki_slim.json)"
          test "$(sha256sum < composeApp/src/desktopMain/resources/dosewiki_slim.json)" = "$(sha256sum < composeApp/src/iosMain/resources/dosewiki_slim.json)"
          test "$(sha256sum < composeApp/src/desktopMain/resources/dosewiki_slim.json)" = "$(sha256sum < composeApp/src/androidMain/assets/dosewiki_slim.json)"
          echo "DOSEWIKI IDENTICAL: all four dosewiki_slim.json copies match."
          sha256sum composeApp/src/desktopMain/resources/dosewiki_taxonomy.json \
            composeApp/src/desktopTest/resources/dosewiki_taxonomy.json \
            composeApp/src/jvmMain/resources/dosewiki_taxonomy.json \
            composeApp/src/iosMain/resources/dosewiki_taxonomy.json \
            composeApp/src/androidMain/assets/dosewiki_taxonomy.json
          test "$(sha256sum < composeApp/src/desktopMain/resources/dosewiki_taxonomy.json)" = "$(sha256sum < composeApp/src/desktopTest/resources/dosewiki_taxonomy.json)"
          test "$(sha256sum < composeApp/src/desktopMain/resources/dosewiki_taxonomy.json)" = "$(sha256sum < composeApp/src/jvmMain/resources/dosewiki_taxonomy.json)"
          test "$(sha256sum < composeApp/src/desktopMain/resources/dosewiki_taxonomy.json)" = "$(sha256sum < composeApp/src/iosMain/resources/dosewiki_taxonomy.json)"
          test "$(sha256sum < composeApp/src/desktopMain/resources/dosewiki_taxonomy.json)" = "$(sha256sum < composeApp/src/androidMain/assets/dosewiki_taxonomy.json)"
          echo "TAXONOMY IDENTICAL: all five dosewiki_taxonomy.json copies match."

      - name: Compile common + desktop sources
        run: ./gradlew composeApp:compileKotlinDesktop --no-daemon

      # Hand-inlined --tests filter lists are banned here and in scripts/run-tests.sh: two maintained lists drift (audit C6).
      - name: Run all unit tests
        run: ./gradlew composeApp:desktopTest --no-daemon

      - name: Compile Android sources
        run: |
          ./gradlew composeApp:compileDebugKotlinAndroid \
            -x checkDebugAarMetadata \
            --no-daemon

      # wave4: androidUnitTest source set (local JVM unit tests for the Android actuals, which audit 4 scored as zero-covered).
      - name: Run Android unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref_name != 'master' }}

      - name: Build Android debug APK
        run: |
          ./gradlew composeApp:assembleDebug \
            -x checkDebugAarMetadata \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nepenthe-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  # This job runs the iOS tests (iosSimulatorArm64Test) rather than only linking them.
  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref_name != 'master' }}

      # UIKit only declares that class in the iOS 26 SDK (YouTrack CMP-10179).
      - name: Pin Xcode 26 (iOS 26 SDK)
        run: |
          XCODE=/Applications/Xcode_26.2.app
          if [ ! -d "$XCODE" ]; then
            echo "::error::Missing $XCODE, so the iOS 26 SDK is unavailable. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "simulator SDK version: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Probe iOS SDK for SecKeyCopyKeyExchangeResult
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "SDK: $SDK"
          grep -n "SecKeyCopyKeyExchangeResult" "$SDK/usr/include/Security/SecKey.h" | head -5 || echo "NOT FOUND in iOS simulator SDK SecKey.h"

      - name: Compile iOS framework (simulator)
        run: |
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon

      - name: Compile iOS framework (device)
        run: |
          ./gradlew :composeApp:linkDebugFrameworkIosArm64 --no-daemon

      # The iosSimulatorArm64Test task existed from the moment the iosTest source set was wired (build.gradle.kts) but was never invoked
      - name: Show simulator runtimes and devices
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Run iOS simulator tests (commonTest + iosTest)
        run: ./gradlew :composeApp:iosSimulatorArm64Test --no-daemon

      # Kotlin/Native no longer targets the x86_64 simulator and the runner is Apple Silicon
      - name: Verify Xcode project builds
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme "Nepenthe Journal" \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            build

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: composeApp/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
