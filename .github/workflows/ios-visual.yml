name: iOS visual

# iPhone/macOS runs from a Windows workstation: this job boots a real simulator
# on a macOS runner, launches the app and uploads screenshots. Start it from the
# Actions tab, or with:
#   gh workflow run ios-visual.yml -f appearance=dark

on:
  workflow_dispatch:
    inputs:
      appearance:
        description: Simulator appearance
        type: choice
        options: [light, dark]
        default: light
      settle_seconds:
        description: Seconds to let the app run before the screenshot
        type: string
        default: "25"

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Pin Xcode 26 (iOS 26 SDK)
        run: |
          XCODE=/Applications/Xcode_26.2.app
          if [ ! -d "$XCODE" ]; then
            echo "::error::Missing $XCODE, so the iOS 26 SDK is unavailable. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build the shared framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon

      - name: Build the app for the simulator
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme "Nepenthe Journal" \
            -sdk iphonesimulator \
            -configuration Debug \
            ARCHS=arm64 \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot an available iPhone
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator runtime on this runner"
            xcrun simctl list runtimes
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install, launch, capture
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          APP=$(find iosApp/build/dd/Build/Products -maxdepth 3 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app built"; exit 1; fi
          echo "installing $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance "${{ inputs.appearance }}"
          xcrun simctl launch "$UDID" app.journal.nepenthe
          mkdir -p artifacts
          # Let the first launch finish: it parses the bundled library on a fresh install.
          for i in $(seq 1 "${{ inputs.settle_seconds }}"); do
            sleep 1
            xcrun simctl io "$UDID" screenshot "artifacts/frame-$(printf '%02d' "$i").png" >/dev/null 2>&1 || true
          done

      - name: Collect the app log
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "Nepenthe Journal" OR process == "iosApp"' \
            > artifacts/app.log 2>&1 || true
          ls -la artifacts || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-shots
          path: artifacts
          retention-days: 14
          if-no-files-found: warn

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the desktop app and capture the screen
        run: |
          set -euo pipefail
          mkdir -p artifacts
          nohup ./gradlew :composeApp:run --no-daemon > artifacts/desktop-run.log 2>&1 &
          sleep 75
          screencapture -x artifacts/desktop.png || true
          tail -n 40 artifacts/desktop-run.log || true

      - name: Upload the macOS screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-desktop-shots
          path: artifacts
          retention-days: 14
          if-no-files-found: warn
