name: fdroid

concurrency:
  group: fdroid-${{ github.ref }}
  cancel-in-progress: true

# NOTE: fdroid/play pin Java 17 for the Android toolchain while CI and

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-a:
    name: Build APK (A)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      # android-actions/setup-android@v3 is deliberately absent: its default sdkmanager package list includes 'tools' ships a licensed Android SDK
      # ships a licensed Android SDK; the CI android-build job builds with no
      - name: Build release APK
        run: |
          ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace -Pnepenthe.noSign=true
      - name: Hash the APK
        run: |
          sha256sum composeApp/build/outputs/apk/release/*.apk > apk-a.sha256
          cat apk-a.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk-a
          path: apk-a.sha256
          retention-days: 7

  build-b:
    name: Build APK (B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      # android-actions/setup-android@v3 is deliberately absent: its default sdkmanager package list includes 'tools' ships a licensed Android SDK
      # ships a licensed Android SDK; the CI android-build job builds with no
      - name: Build release APK
        run: |
          ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace -Pnepenthe.noSign=true
      - name: Hash the APK
        run: |
          sha256sum composeApp/build/outputs/apk/release/*.apk > apk-b.sha256
          cat apk-b.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk-b
          path: apk-b.sha256
          retention-days: 7

  compare:
    name: Verify reproducible build
    runs-on: ubuntu-latest
    needs: [build-a, build-b]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk-a
          path: a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk-b
          path: b
      - name: Compare hashes
        run: |
          echo "--- build A ---"; cat a/apk-a.sha256
          echo "--- build B ---"; cat b/apk-b.sha256
          if ! diff -q a/apk-a.sha256 b/apk-b.sha256; then
            echo "::error::APK builds are NOT reproducible. Investigate build-time"
            echo "::error::timestamps, ordering, or toolchain drift before submitting to F-Droid."
            exit 1
          fi
          echo "REPRODUCIBLE: both builds produced byte-identical APKs."
