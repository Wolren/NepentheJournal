name: Release

# Signing needs WINDOWS_SIGN_PFX_BASE64 and WINDOWS_SIGN_PASSWORD, or WINDOWS_SIGN_THUMBPRINT, as repo secrets
# macOS signing reads MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD and MACOS_SIGN_IDENTITY, notarization reads MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_PASSWORD and MACOS_NOTARY_TEAM_ID
# The Compose Gradle plugin auto-provisions WiX 3.11 (downloadWix/unzipWix tasks) and jpackage comes from the Gradle JVM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Release files only: publishing happens in the publish job with an explicit
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx2g

jobs:
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: versionName, packageVersion and About card must agree
        run: |
          set -euo pipefail
          # Anchored to nativeDistributions indentation (12 spaces)
          V=$(sed -n 's/^            packageVersion = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts)
          test -n "$V" || { echo "::error::packageVersion not found in build.gradle.kts"; exit 1; }
          echo "packageVersion=$V"
          grep -qF "versionName = \"$V\"" composeApp/build.gradle.kts \
            || { echo "::error::versionName does not match packageVersion $V"; exit 1; }
          grep -qF "Nepenthe Journal v$V" \
              composeApp/src/commonMain/kotlin/app/journal/ui/settings/detail/SettingsInfoCards.kt \
            || { echo "::error::About card string does not match version $V"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$V" \
              || { echo "::error::tag $GITHUB_REF_NAME does not match version v$V"; exit 1; }
          fi
          echo "VERSION_OK $V"

  msi:
    name: Windows MSI
    needs: verify-version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Build MSI
        run: ./gradlew :composeApp:packageMsi --no-daemon

      # A tag must carry a trusted signature: the script fails -Required when no certificate is set.
      - name: Sign the MSI
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          WINDOWS_SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
        run: ./scripts/sign-windows.ps1 -Files "composeApp/build/compose/binaries/main/msi/*.msi" -Required:($env:GITHUB_REF_TYPE -eq 'tag')

      # Publishes only what installs: the signed MSI is installed, launched and removed again.
      - name: Install, launch and uninstall the MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem composeApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName
          ./scripts/test-windows-installer.ps1 -Msi $msi

      - uses: actions/upload-artifact@v7
        with:
          name: release-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  portable:
    name: Windows portable zip
    needs: verify-version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Build the app image
        run: ./gradlew :composeApp:createDistributable --no-daemon

      # jpackage marks the launcher read-only and signs nothing, so this artifact carries the signature.
      - name: Sign the launcher
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          WINDOWS_SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
        run: ./scripts/sign-windows.ps1 -Files "composeApp/build/compose/binaries/main/app/Nepenthe Journal/Nepenthe Journal.exe" -Required:($env:GITHUB_REF_TYPE -eq 'tag')

      - name: Zip the image
        shell: pwsh
        run: |
          $V = (Select-String -Path composeApp/build.gradle.kts -Pattern '^            packageVersion = "([^"]+)"').Matches[0].Groups[1].Value
          $root = "composeApp/build/compose/binaries/main/app/Nepenthe Journal"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dest = "dist/Nepenthe-Journal-$V-windows-x64.zip"
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          if (Test-Path $tar) {
            & $tar -a -c -f $dest -C (Resolve-Path $root).Path "."
          } else {
            Compress-Archive -Path "$root\*" -DestinationPath $dest
          }
          Get-Item $dest | Select-Object Name, Length

      - name: Extract and launch the zip
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip | Select-Object -First 1).FullName
          ./scripts/test-windows-portable.ps1 -Zip $zip

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-zip
          path: dist/*.zip
          if-no-files-found: error

  deb:
    name: Linux DEB
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Ensure fakeroot (required by the jpackage DEB bundler)
        run: command -v fakeroot || (sudo apt-get update -q && sudo apt-get install -y fakeroot)
      - name: Build DEB
        run: ./gradlew :composeApp:packageDeb --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: release-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  dmg:
    name: macOS DMG
    needs: verify-version
    runs-on: macos-15
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # The build turns signing and notarization on only when these variables hold a Developer ID.
      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build DMG
        run: ./gradlew :composeApp:packageDmg --no-daemon
      - name: Dump jpackage logs on failure
        if: failure()
        run: |
          shopt -s nullglob
          for f in composeApp/build/compose/logs/*/*.txt; do
            echo "===== $f ====="
            cat "$f"
          done
      # A tag needs a stapled, notarized image; without the secrets this check stays off.
      - name: Verify the signed and notarized DMG
        if: github.ref_type == 'tag' && env.MACOS_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          DMG=$(ls composeApp/build/compose/binaries/main/dmg/*.dmg | head -1)
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          echo "DMG is signed, notarized and stapled: $DMG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [msi, portable, deb, dmg]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          ls -la
          sha256sum *.msi *.zip *.deb *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nepenthe Journal $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.msi dist/*.zip dist/*.deb dist/*.dmg dist/SHA256SUMS.txt
