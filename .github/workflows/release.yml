name: Release

# Signing needs WINDOWS_SIGN_PFX_BASE64 and WINDOWS_SIGN_PASSWORD, or WINDOWS_SIGN_THUMBPRINT, as repo secrets
# macOS signing reads MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD and MACOS_SIGN_IDENTITY, notarization reads MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_PASSWORD and MACOS_NOTARY_TEAM_ID
# The Compose Gradle plugin auto-provisions WiX 3.11 (downloadWix/unzipWix tasks) and jpackage comes from the Gradle JVM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Release files only: publishing happens in the publish job with an explicit
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx2g

jobs:
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: versionName, packageVersion and About card must agree
        run: |
          set -euo pipefail
          # Anchored to nativeDistributions indentation (12 spaces)
          V=$(sed -n 's/^            packageVersion = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts)
          test -n "$V" || { echo "::error::packageVersion not found in build.gradle.kts"; exit 1; }
          echo "packageVersion=$V"
          grep -qF "versionName = \"$V\"" composeApp/build.gradle.kts \
            || grep -qF "versionName = \"$V-alpha\"" composeApp/build.gradle.kts \
            || { echo "::error::versionName does not match packageVersion $V (or $V-alpha)"; exit 1; }
          grep -qF "Nepenthe Journal v$V" \
              composeApp/src/commonMain/kotlin/app/journal/ui/settings/detail/SettingsInfoCards.kt \
            || { echo "::error::About card string does not match version $V"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$V" -o "$GITHUB_REF_NAME" = "v$V-alpha" \
              || { echo "::error::tag $GITHUB_REF_NAME does not match version v$V or v$V-alpha"; exit 1; }
          fi
          echo "VERSION_OK $V"

  msi:
    name: Windows MSI
    needs: verify-version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true
      # The catalog is a build artifact, not a checked-in file; a build without it silently ships 613 substances.
      - name: Build the substance catalog
        run: |
          python scripts/build_substance_db.py
          test -f build/substance-db/substances.sqlite

      - name: Build MSI
        run: ./gradlew :composeApp:packageMsi --no-daemon

      # A configured certificate must sign a stable tag; a project without one publishes unsigned and says so.
      - name: Sign the MSI
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          WINDOWS_SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
        run: ./scripts/sign-windows.ps1 -Files "composeApp/build/compose/binaries/main/msi/*.msi" -Required:($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -notmatch '-alpha$' -and (-not [string]::IsNullOrEmpty($env:WINDOWS_SIGN_PFX_BASE64) -or -not [string]::IsNullOrEmpty($env:WINDOWS_SIGN_THUMBPRINT)))

      # Publishes only what installs: the signed MSI is installed, launched and removed again.
      - name: Install, launch and uninstall the MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem composeApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName
          ./scripts/test-windows-installer.ps1 -Msi $msi

      # The portable image shares the Windows job: one runner, two artifacts.
      - name: Build the app image
        run: ./gradlew :composeApp:createDistributable --no-daemon

      - name: Sign the launcher
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          WINDOWS_SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
        run: ./scripts/sign-windows.ps1 -Files "composeApp/build/compose/binaries/main/app/Nepenthe Journal/Nepenthe Journal.exe" -Required:($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -notmatch '-alpha$' -and (-not [string]::IsNullOrEmpty($env:WINDOWS_SIGN_PFX_BASE64) -or -not [string]::IsNullOrEmpty($env:WINDOWS_SIGN_THUMBPRINT)))

      - name: Zip the image
        shell: pwsh
        run: |
          $V = (Select-String -Path composeApp/build.gradle.kts -Pattern '^            packageVersion = "([^"]+)"').Matches[0].Groups[1].Value
          $root = "composeApp/build/compose/binaries/main/app/Nepenthe Journal"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dest = "dist/Nepenthe-Journal-$V-windows-x64.zip"
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          if (Test-Path $tar) {
            & $tar -a -c -f $dest -C (Resolve-Path $root).Path "."
          } else {
            Compress-Archive -Path "$root\*" -DestinationPath $dest
          }
          Get-Item $dest | Select-Object Name, Length

      - name: Extract and launch the zip
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip | Select-Object -First 1).FullName
          ./scripts/test-windows-portable.ps1 -Zip $zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows-zip
          path: dist/*.zip
          if-no-files-found: error

  android:
    name: Android APK
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true

      # Sign with the upload key when every secret exists; otherwise the build falls back to debug signing.
      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "No complete upload keystore; the APK falls back to debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > nepenthe-upload.keystore
          cat > keystore.properties <<EOF
          storeFile=nepenthe-upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build the substance catalog
        run: |
          python3 scripts/build_substance_db.py
          test -f build/substance-db/substances.sqlite

      - name: Build the release APK
        run: |
          set -euo pipefail
          ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace
          V=$(sed -n 's/^            packageVersion = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts)
          mkdir -p dist
          APK=$(ls composeApp/build/outputs/apk/release/*.apk | head -n 1)
          # A release without the catalog silently ships 613 substances instead of 1675.
          unzip -l "$APK" | grep -q 'assets/substances.sqlite' \
            || { echo "::error::$APK ships without the substance catalog"; exit 1; }
          cp "$APK" "dist/Nepenthe-Journal-$V-android.apk"
          # An obfuscated crash stack is useless without this file, so it ships beside the APK.
          cp composeApp/build/outputs/mapping/release/mapping.txt "dist/Nepenthe-Journal-$V-android-mapping.txt"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-apk
          path: |
            dist/*.apk
            dist/*-mapping.txt
          if-no-files-found: error

  deb:
    name: Linux DEB
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true
      - name: Ensure fakeroot (required by the jpackage DEB bundler)
        run: command -v fakeroot || (sudo apt-get update -q && sudo apt-get install -y fakeroot)
      - name: Build the substance catalog
        run: |
          python3 scripts/build_substance_db.py
          test -f build/substance-db/substances.sqlite

      - name: Build DEB
        run: ./gradlew :composeApp:packageDeb --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  dmg:
    name: macOS DMG (${{ matrix.arch }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Macs cannot run the arm64 image, so both hosted macOS images ship a DMG.
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true

      # The build turns signing and notarization on only when these variables hold a Developer ID.
      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build the substance catalog
        run: |
          python3 scripts/build_substance_db.py
          test -f build/substance-db/substances.sqlite

      - name: Build DMG
        run: ./gradlew :composeApp:packageDmg --no-daemon

      - name: Tag the DMG with its architecture
        run: |
          set -euo pipefail
          for f in composeApp/build/compose/binaries/main/dmg/*.dmg; do
            mv "$f" "${f%.dmg}-${{ matrix.arch }}.dmg"
          done
          ls -l composeApp/build/compose/binaries/main/dmg

      - name: Dump jpackage logs on failure
        if: failure()
        run: |
          shopt -s nullglob
          for f in composeApp/build/compose/logs/*/*.txt; do
            echo "===== $f ====="
            cat "$f"
          done
      # A tag needs a stapled, notarized image; without the secrets this check stays off.
      - name: Verify the signed and notarized DMG
        if: github.ref_type == 'tag' && env.MACOS_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          DMG=$(ls composeApp/build/compose/binaries/main/dmg/*.dmg | head -1)
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          echo "DMG is signed, notarized and stapled: $DMG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dmg-${{ matrix.arch }}
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [msi, android, deb, dmg]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release body is built from the changelog, so the job needs the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
          path: dist
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          ls -la
          sha256sum *.msi *.zip *.deb *.dmg *.apk *-mapping.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Detached GPG signature over the checksums. Without a CA code-signing
      # certificate this is the only tamper evidence for the artifact bytes.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "No RELEASE_SIGNING_KEY secret; publishing unsigned checksums."
            exit 0
          fi
          echo "$RELEASE_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${RELEASE_SIGNING_PASSPHRASE:-}" \
            --armor --detach-sign --output dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          gpg --verify dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        run: |
          set -euo pipefail
          # An -alpha tag publishes as a GitHub prerelease: no releases/latest pointer.
          if [[ "$GITHUB_REF_NAME" == *-alpha ]]; then PRERELEASE=--prerelease; else PRERELEASE=; fi
          # Without a signing certificate the installers are unsigned; say so
          # on the release itself instead of leaving it to the user to find out.
          TITLE="Nepenthe Journal $GITHUB_REF_NAME"
          if [ -z "${WINDOWS_SIGN_PFX_BASE64:-}" ]; then TITLE="$TITLE (unsigned)"; fi
          # The release body is the curated changelog, not a dump of every commit.
          if [[ "$GITHUB_REF_NAME" == *-alpha ]]; then
            echo "This is an alpha build: the feature set and the on-disk format can still change. Keep a sealed backup of your journal." > release-notes.md
            echo >> release-notes.md
          else
            : > release-notes.md
          fi
          cat .github/release-header.md CHANGELOG.md >> release-notes.md
          ASSETS="dist/*.msi dist/*.zip dist/*.deb dist/*.dmg dist/*.apk dist/SHA256SUMS.txt"
          if [ -f dist/SHA256SUMS.txt.asc ]; then ASSETS="$ASSETS dist/SHA256SUMS.txt.asc"; fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file release-notes.md $PRERELEASE \
            $ASSETS
