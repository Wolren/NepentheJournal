[versions]
kotlin                 = "2.4.0"
agp                    = "9.2.1"
kotlinx-coroutines     = "1.11.0"
kotlinx-serialization  = "1.11.0"
kotlinx-datetime       = "0.8.0"
ktor                   = "3.5.1"
kotbase                = "3.2.4-1.2.0"
androidx-activity      = "1.13.0"
multiplatform-settings = "1.3.0"
logback                 = "1.5.38"
ktor-server            = "3.5.1"
jmdns                  = "3.6.3"
coil                   = "3.0.4"
vico                   = "3.2.3"
kermit                 = "2.1.0"

bouncycastle = "1.78.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-serialization   = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime        = { module = "org.jetbrains.kotlinx:kotlinx-datetime",           version.ref = "kotlinx-datetime" }
ktor-client-core        = { module = "io.ktor:ktor-client-core",                version.ref = "ktor" }
ktor-client-cio         = { module = "io.ktor:ktor-client-cio",                 version.ref = "ktor" }
ktor-client-darwin      = { module = "io.ktor:ktor-client-darwin",              version.ref = "ktor" }
ktor-client-content     = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization      = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotbase-couchbase-lite  = { module = "dev.kotbase:couchbase-lite",              version.ref = "kotbase" }
kotbase-ee              = { module = "dev.kotbase:couchbase-lite-ee",           version.ref = "kotbase" }
androidx-activity       = { module = "androidx.activity:activity-compose",      version.ref = "androidx-activity" }
multiplatform-settings  = { module = "com.russhwolf:multiplatform-settings",    version.ref = "multiplatform-settings" }
logback-classic         = { module = "ch.qos.logback:logback-classic",          version.ref = "logback" }
ktor-server-cio         = { module = "io.ktor:ktor-server-cio",                version.ref = "ktor-server" }
ktor-server-netty        = { module = "io.ktor:ktor-server-netty",              version.ref = "ktor-server" }
ktor-server-core        = { module = "io.ktor:ktor-server-core",               version.ref = "ktor-server" }
ktor-server-content     = { module = "io.ktor:ktor-server-content-negotiation",version.ref = "ktor-server" }
ktor-server-test-host   = { module = "io.ktor:ktor-server-test-host",           version.ref = "ktor-server" }
jmdns                   = { module = "org.jmdns:jmdns",                        version.ref = "jmdns" }
coil-compose            = { module = "io.coil-kt.coil3:coil-compose",           version.ref = "coil" }
coil-network-ktor       = { module = "io.coil-kt.coil3:coil-network-ktor3",    version.ref = "coil" }
vico-compose            = { module = "com.patrykandpatrick.vico:compose",            version.ref = "vico" }
vico-compose-m3         = { module = "com.patrykandpatrick.vico:compose-m3",         version.ref = "vico" }
bouncycastle-bcpkix     = { module = "org.bouncycastle:bcpkix-jdk18on",       version.ref = "bouncycastle" }
ktor-server-websockets  = { module = "io.ktor:ktor-server-websockets",        version.ref = "ktor-server" }
ktor-client-websockets  = { module = "io.ktor:ktor-client-websockets",        version.ref = "ktor" }
kermit-core             = { module = "co.touchlab:kermit",                   version.ref = "kermit" }
kermit-io               = { module = "co.touchlab:kermit-io",                version.ref = "kermit" }

[plugins]
kotlin-multiplatform    = { id = "org.jetbrains.kotlin.multiplatform",       version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",      version.ref = "kotlin" }
compose-multiplatform   = { id = "org.jetbrains.compose",                    version = "1.11.1" }
android-application     = { id = "com.android.application",                  version.ref = "agp" }
